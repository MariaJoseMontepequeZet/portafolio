# Configuración de nginx del contenedor «portafolio-web».
# Vive en el servidor, en ~/portafolio/nginx.conf, montada en
# /etc/nginx/conf.d/default.conf. Se guarda aquí como referencia: el despliegue
# automático NO la copia, así que un cambio hay que aplicarlo a mano
# (ver docs/despliegue-servidor.md).

server {
    listen 80;
    server_name _;

    # no mostrar la versión de nginx en las cabeceras ni en las páginas de error
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;

    # Cabeceras de seguridad. Van a nivel de `server` para que las reciban todas
    # las respuestas, incluida la página 404. La CSP permite el script y el envío
    # de datos de Cloudflare Web Analytics, que Cloudflare inyecta en las páginas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # página 404 propia, con el diseño del sitio
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
        # `expires -1` envía «Cache-Control: no-cache» sin usar add_header, así
        # no se pierden las cabeceras de seguridad de arriba.
        expires -1;
    }
}
